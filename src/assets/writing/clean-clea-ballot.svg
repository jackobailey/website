  <title id="clea-ballot-title">A closer look at an imaginary ballot</title>
  <desc id="clea-ballot-description">A magnifying glass moves across one stationary ballot paper, enlarging the coloured party symbols, straight lines, and voting boxes beneath its lens. A black X marks the leaf party's box. The ballot is illustrative and contains no real candidates or election results.</desc>
