[functions.lecture]
  included_files = ["netlify/lecture/slides.html"]

[[headers]]
  for = "/poli10302/live/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/poli10302/assessments/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "public, max-age=0, must-revalidate"
